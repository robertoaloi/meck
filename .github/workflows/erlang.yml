name: Continuous Integration

on:
  - push
  - pull_request
  - workflow_dispatch

jobs:
  ci:
    runs-on: ubuntu-24.04
    name: Erlang ${{matrix.otp}} / rebar ${{matrix.rebar3}}
    env:
      ELP_VERSION: "2026-11-16"
    strategy:
      # Let the OTP 29 job, the one annotating findings, finish when another one fails
      fail-fast: false
      matrix:
        otp: ["27", "28", "29"]
        rebar3: ["3"]
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          rebar3-version: ${{matrix.rebar3}}

      - uses: actions/cache@v4
        env:
          cache-name: rebar3
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: ci-${{runner.os}}-${{env.cache-name}}-otp_${{matrix.otp}}-rebar_${{matrix.rebar3}}-${{hashFiles('rebar.lock')}}
          restore-keys: |
            ci-${{runner.os}}-${{env.cache-name}}-otp_${{matrix.otp}}-rebar_${{matrix.rebar3}}
            ci-${{runner.os}}-${{env.cache-name}}-otp_${{matrix.otp}}

      - name: Compile
        run: rebar3 do clean, compile

      - name: Analyze
        run: rebar3 do xref, dialyzer

      - uses: erlef/setup-elp@731aba4d81a842d5acb0595644085efea27b8e1d # elp-problem-matchers
        with:
          elp-version: ${{env.ELP_VERSION}}
          # Annotate findings once, not once per OTP version
          problem-matchers: ${{ matrix.otp == '29' }}

      - name: ELP lint
        run: elp lint --no-connect --format json

      - name: eqWAlizer
        if: ${{ !cancelled() }}
        run: elp eqwalize-all --no-connect --bail-on-error

      - name: Test
        run: rebar3 do eunit, ct
