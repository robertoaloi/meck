name: Continuous Integration

on:
  - push
  - pull_request
  - workflow_dispatch

env:
  # The ELP build is tied to an Erlang/OTP <major>.<minor> version
  ELP_OTP_VERSION: "29.1"

jobs:
  ci:
    runs-on: ubuntu-24.04
    name: Erlang ${{matrix.otp}} / rebar ${{matrix.rebar3}}
    strategy:
      matrix:
        otp: ["27", "28", "29"]
        rebar3: ["3"]
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          rebar3-version: ${{matrix.rebar3}}

      - uses: actions/cache@v4
        env:
          cache-name: rebar3
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: ci-${{runner.os}}-${{env.cache-name}}-otp_${{matrix.otp}}-rebar_${{matrix.rebar3}}-${{hashFiles('rebar.lock')}}
          restore-keys: |
            ci-${{runner.os}}-${{env.cache-name}}-otp_${{matrix.otp}}-rebar_${{matrix.rebar3}}
            ci-${{runner.os}}-${{env.cache-name}}-otp_${{matrix.otp}}

      - name: Compile
        run: rebar3 do clean, compile

      - name: Analyze
        run: rebar3 do xref, dialyzer

      - name: Test
        run: rebar3 do eunit, ct

  # ELP with `--format github` is not released yet: build it from
  # https://github.com/WhatsApp/erlang-language-platform/pull/329, the way ELP's own CI does
  build-elp:
    runs-on: ubuntu-22.04
    name: Build ELP (WhatsApp/erlang-language-platform#329)
    steps:
      - uses: actions/checkout@v4
        with:
          repository: WhatsApp/erlang-language-platform
          ref: refs/pull/329/head

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "17"
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: olafurpg/setup-scala@v14
        with:
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{env.ELP_OTP_VERSION}}
          rebar3-version: "3"

      - name: Build eqWAlizer
        working-directory: eqwalizer/eqwalizer
        run: |
          sbt assembly
          native-image -H:IncludeResources=application.conf --no-server --no-fallback -jar target/scala-3.6.4/eqwalizer.jar eqwalizer

      - name: Build ELP
        env:
          EQWALIZER_DIR: ${{github.workspace}}/eqwalizer/eqwalizer
          ELP_EQWALIZER_PATH: ${{github.workspace}}/eqwalizer/eqwalizer/eqwalizer
        run: cargo build --release

      - name: Package ELP like a release asset
        run: tar -czf elp.tar.gz -C target/release elp

      - uses: actions/upload-artifact@v4
        with:
          name: elp
          path: elp.tar.gz

  elp:
    needs: build-elp
    runs-on: ubuntu-24.04
    name: ELP lint and eqWAlizer (annotations)
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{env.ELP_OTP_VERSION}}
          rebar3-version: "3"

      - name: Compile
        run: rebar3 compile

      - uses: actions/download-artifact@v4
        with:
          name: elp
          path: ${{runner.temp}}/elp-build

      - uses: robertoaloi/setup-elp@27fd9c1a15eddf857c698995db35f5c83d19c263 # elp-github-format
        with:
          elp-tarball: ${{runner.temp}}/elp-build/elp.tar.gz

      - name: ELP lint
        run: elp lint --no-connect --format github

      - name: eqWAlizer
        if: ${{ !cancelled() }}
        run: elp eqwalize-all --no-connect --format github --bail-on-error
